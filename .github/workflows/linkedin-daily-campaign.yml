name: EzProctor daily LinkedIn campaign

on:
  schedule:
    # 04:00 UTC is 12:00 PM Australia/Perth (AWST).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      campaign_date:
        description: Optional campaign date (YYYY-MM-DD)
        required: false
        type: string
      publish:
        description: Publish both posts to LinkedIn
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ezproctor-linkedin-daily
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EzProctor
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install infographic renderer
        run: python -m pip install --requirement scripts/linkedin/requirements.txt

      - name: Select campaign date
        shell: bash
        run: |
          requested="${{ inputs.campaign_date }}"
          if [ -n "$requested" ]; then
            campaign_date="$requested"
          else
            campaign_date="$(TZ=Australia/Perth date +%F)"
          fi
          echo "CAMPAIGN_DATE=$campaign_date" >> "$GITHUB_ENV"

      - name: Generate two EzProctor posts
        run: python scripts/linkedin/generate_campaign.py --date "$CAMPAIGN_DATE" --output campaign-output

      - name: Keep campaign preview
        uses: actions/upload-artifact@v4
        with:
          name: ezproctor-linkedin-${{ env.CAMPAIGN_DATE }}
          path: campaign-output/
          retention-days: 30

      - name: Validate publishing configuration
        if: ${{ (github.event_name == 'schedule' && vars.LINKEDIN_PUBLISH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: test -n "$LINKEDIN_ACCESS_TOKEN" || (echo "LINKEDIN_ACCESS_TOKEN secret is missing" && exit 1)

      - name: Publish to EzProctor LinkedIn
        if: ${{ (github.event_name == 'schedule' && vars.LINKEDIN_PUBLISH_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION }}
        run: python scripts/linkedin/publish_campaign.py --campaign campaign-output
