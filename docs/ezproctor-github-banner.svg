<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">EzProctor Exam</title>
  <desc id="desc">Secure assessment operations for modern educators</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092b26"/>
      <stop offset="1" stop-color="#15594d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9f27c"/>
      <stop offset="1" stop-color="#f4a47a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#031713" flood-opacity=".35"/>
    </filter>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1100" cy="-10" r="210" fill="none" stroke="#d9f27c" stroke-opacity=".16" stroke-width="52"/>
  <circle cx="1040" cy="350" r="150" fill="#f4a47a" fill-opacity=".12"/>
  <g transform="translate(76 70)" filter="url(#shadow)">
    <rect width="188" height="188" rx="46" fill="#fffdf8"/>
    <rect x="20" y="20" width="148" height="148" rx="35" fill="#103d35"/>
    <text x="94" y="113" text-anchor="middle" fill="#d9f27c" font-family="Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="5">EZ</text>
  </g>
  <g transform="translate(318 82)">
    <text x="0" y="82" fill="#fffdf8" font-family="Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-3">EzProctor</text>
    <text x="402" y="82" fill="#d9f27c" font-family="Arial, sans-serif" font-size="76" font-weight="400" letter-spacing="-3">Exam</text>
    <rect x="2" y="112" width="650" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="2" y="166" fill="#d7e5e0" font-family="Arial, sans-serif" font-size="25" letter-spacing="1.5">SECURE ASSESSMENT OPERATIONS FOR EDUCATORS</text>
    <g transform="translate(2 196)" font-family="Arial, sans-serif" font-size="16" font-weight="700">
      <rect width="138" height="38" rx="19" fill="#d9f27c"/>
      <text x="69" y="25" text-anchor="middle" fill="#092b26">SELF-HOSTED</text>
      <rect x="150" width="148" height="38" rx="19" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="224" y="25" text-anchor="middle" fill="#fffdf8">LAN-FIRST</text>
      <rect x="310" width="176" height="38" rx="19" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".22"/>
      <text x="398" y="25" text-anchor="middle" fill="#fffdf8">CODING + WRITTEN</text>
    </g>
  </g>
