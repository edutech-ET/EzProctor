services:
  ezproctor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ezproctor-exam
    ports:
      - "8787:8787"
    environment:
      BACKEND_PORT: 8787
      CLOUDIDE_SECURE_DATA_DIR: /app/backend/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    volumes:
      - ezproctor_data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  ezproctor_data:

